name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA: a tag is mutable and can be repointed by the action owner.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck incoming_connection_log.sh tests/run_tests.sh
      - name: tests
        run: bash tests/run_tests.sh
